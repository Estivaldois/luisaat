<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Sem Título-1.png" type="image/png">
</head>

<body>
    <div class="container">
        <h1>CALCULADORA LUISA PRADO</h1>

        <div class="input-area">
            <div class="input-group">
                <div class="field">
                    <label for="patientName">Paciente (Opcional)</label>
                    <input type="text" id="patientName" placeholder="Ex: João">
                </div>
                <div class="field">
                    <label for="hourlyRate">Valor/Hora (R$)</label>
                    <input type="number" id="hourlyRate" placeholder="0.00" step="0.01">
                </div>
                <div class="field">
                    <label for="daysPerWeek">Dias/Semana</label>
                    <input type="number" id="daysPerWeek" placeholder="1-7" min="1" max="7">
                </div>
            </div>
            <button class="btn-add" onclick="addPatient()">Adicionar Paciente</button>
        </div>

        <div class="results">
            <h3>Lista de Pacientes</h3>
            <div id="patientList" class="patient-list">
                <!-- Pacientes aparecerão aqui -->
            </div>

            <div class="total-box">
                Total Mensal: R$ <span id="totalValue">0,00</span>
            </div>
            <p class="info-text">* Cálculo baseado em 2h por sessão e 4 semanas por mês.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
